<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnnaKram Portal Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Tri-band accent strip (palette colours only) -->
  <div class="top-strip" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- 1. Official Branding Header -->
  <header class="gov-header">
    <div class="header-brand">
      <!-- Emblem placeholder: replace with the official emblem asset -->
      <div class="brand-emblem" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="2.2"></circle>
          <path d="M12 3v6M12 15v6M3 12h6M15 12h6M5.6 5.6l4.2 4.2M14.2 14.2l4.2 4.2M18.4 5.6l-4.2 4.2M9.8 14.2l-4.2 4.2"></path>
        </svg>
      </div>
      <div class="brand-titles">
        <h1 class="portal-title" id="txtPortalTitle">AnnaKram</h1>
      </div>
    </div>

    <div class="header-right">
      <!-- Language Translation Switcher Button -->
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" id="langEn">EN</button>
        <button type="button" class="lang-btn" id="langHi">हिन्दी</button>
      </div>

     
  </header>

  <!-- 2. Main Login Canvas (sliding two-panel card) -->
  <main class="login-main">
    <div class="container" id="authContainer">

      <!-- FORM PANEL: slides left <-> right when switching Sign In / Sign Up -->
      <div class="form-panel">

        <!-- Top Icon & Header -->
        <div class="card-hero">
          <div class="hero-icon-wrap">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <h2 class="card-title" id="txtHeroTitle">AnnaKram</h2>
        </div>

        <!-- Tab Switcher: Sign In vs Sign Up -->
        <div class="tab-switch-grid" role="tablist">
          <button type="button" class="tab-btn active" id="tabSignIn" role="tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span id="txtSignInTab">Sign In</span>
          </button>

          <button type="button" class="tab-btn" id="tabSignUp" role="tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span id="txtSignUpTab">Sign Up</span>
          </button>
        </div>

        <!-- Role Selection -->
        <div class="role-section">
          <label class="form-label" id="txtSelectRole">SELECT ACCOUNT TYPE / ROLE <span class="req-star">*</span></label>
          <div class="role-grid">
            <button type="button" class="role-card active" id="roleManagerBtn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                <path d="M10 6h4"></path>
                <path d="M10 10h4"></path>
                <path d="M10 14h4"></path>
                <path d="M10 18h4"></path>
              </svg>
              <span class="role-title" id="txtRoleManager">Godown Manager</span>
              <span class="role-subtitle" id="txtRoleManagerSub">Warehouse &amp; FIFO</span>
            </button>

            <button type="button" class="role-card" id="roleFpsBtn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"></path>
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"></path>
                <path d="M2 7h20"></path>
              </svg>
              <span class="role-title" id="txtRoleFps">FPS Owner</span>
              <span class="role-subtitle" id="txtRoleFpsSub">Fair Price Shop</span>
            </button>
          </div>
        </div>

        <!-- Alert Banners -->
        <div id="errorAlert" class="alert error" style="display: none;" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="errorMessageText"></span>
        </div>

        <div id="successAlert" class="alert success" style="display: none;" role="status">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span id="successMessageText"></span>
        </div>

        <!-- Authentication Form -->
        <form id="authForm" class="auth-form" autocomplete="off">

          <!-- Sign Up Dynamic Fields: Full Name & Entity ID -->
          <div class="form-group signup-only" id="grpFullName" style="display: none;">
            <label for="userName" class="form-label">
              <span id="lblFullName">Full Name</span> <span class="req-star">*</span>
            </label>
            <div class="input-wrap">
              <input type="text" id="userName" class="gov-input" placeholder="e.g. Aryan Kumar Jha">
            </div>
          </div>

          <div class="form-group signup-only" id="grpEntityId" style="display: none;">
            <label for="entityId" class="form-label">
              <span id="lblEntityId">Godown Depot Code</span> <span class="req-star">*</span>
            </label>
            <div class="input-wrap">
              <input type="text" id="entityId" class="gov-input text-upper" placeholder="e.g. GDN-GRN-04">
            </div>
          </div>

          <!-- Email Field -->
          <div class="form-group">
            <label for="userEmail" class="form-label">
              <span id="lblEmail">Email ID</span> <span class="req-star">*</span>
            </label>
            <div class="input-wrap">
              <input type="email" id="userEmail" class="gov-input" placeholder="officer@ipds.gov.in" required>
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <div class="label-row">
              <label for="userPassword" class="form-label">
                <span id="lblPassword">Password</span> <span class="req-star">*</span>
              </label>
              <a href="#forgot" id="forgotPassLink" class="forgot-link">Forgot Password?</a>
            </div>
            <div class="input-wrap">
              <input type="password" id="userPassword" class="gov-input pass-input" placeholder="Enter your password" required>
              <button type="button" class="eye-toggle" id="togglePassBtn" aria-label="Toggle Password Visibility">
                <svg id="eyePassIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                  <line class="eye-slash" x1="3" y1="3" x2="21" y2="21"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password (Sign-up only) -->
          <div class="form-group signup-only" id="grpConfirmPass" style="display: none;">
            <label for="confirmPassword" class="form-label">
              <span id="lblConfirmPassword">Confirm Password</span> <span class="req-star">*</span>
            </label>
            <div class="input-wrap">
              <input type="password" id="confirmPassword" class="gov-input pass-input" placeholder="Re-enter password">
              <button type="button" class="eye-toggle" id="toggleConfirmPassBtn" aria-label="Toggle Password Visibility">
                <svg id="eyeConfirmIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                  <line class="eye-slash" x1="3" y1="3" x2="21" y2="21"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn" id="submitBtn">
            <span id="submitBtnText">Sign In</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <!-- Secondary Bottom Switcher -->
          <div class="bottom-switch-row">
            <span id="footerAccountText">Don't have an account?</span>
            <a href="#toggle" id="bottomSwitchLink" class="switch-link">Sign Up</a>
          </div>
        </form>
      </div>

      <!-- TOGGLE PANEL: curved coloured overlay that slides across the card -->
      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <h2 id="txtToggleLeftTitle">Welcome Back!</h2>
            <p id="txtToggleLeftText">Already registered? Sign in with your official credentials to access the portal.</p>
            <button type="button" class="ghost-btn" id="toggleToSignIn">Sign In</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h2 id="txtToggleRightTitle">Hello, Officer!</h2>
            <p id="txtToggleRightText">Register your Godown or Fair Price Shop account to use all portal features.</p>
            <button type="button" class="ghost-btn" id="toggleToSignUp">Sign Up</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="login.js"></script>
</body>
</html>
